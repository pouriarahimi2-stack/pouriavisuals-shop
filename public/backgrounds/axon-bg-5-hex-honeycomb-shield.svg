<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <pattern id="hexPattern" width="104" height="60" patternUnits="userSpaceOnUse">
      <path d="M 52 0 L 104 30 L 52 60 L 0 30 Z" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.32"/>
      <circle cx="52" cy="30" r="2" fill="#6366f1" fill-opacity="0.4"/>
    </pattern>
    <radialGradient id="plasma1" cx="30%" cy="35%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#3b82f6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="plasma2" cx="72%" cy="68%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#6366f1" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1920" height="1080" fill="#040814"/>
  <rect width="1920" height="1080" fill="url(#plasma1)">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="6s" repeatCount="indefinite"/>
  </rect>
  <rect width="1920" height="1080" fill="url(#plasma2)">
    <animate attributeName="opacity" values="1;0.55;1" dur="7s" repeatCount="indefinite"/>
  </rect>

  <!-- ماتریس شش‌ضلعی سراسری -->
  <rect width="1920" height="1080" fill="url(#hexPattern)"/>

  <!-- سلول‌های شش‌ضلعی درخشان در نقاط کلیدی صفحه -->
  <g stroke="#00f2fe" stroke-width="2.5" fill="#0ea5e9" fill-opacity="0.18">
    <polygon points="420,220 480,255 480,325 420,360 360,325 360,255">
      <animate attributeName="fill-opacity" values="0.05;0.45;0.05" dur="3.5s" repeatCount="indefinite"/>
    </polygon>
    <polygon points="540,290 600,325 600,395 540,430 480,395 480,325" stroke="#c084fc" fill="#8b5cf6">
      <animate attributeName="fill-opacity" values="0.4;0.05;0.4" dur="4s" repeatCount="indefinite"/>
    </polygon>
    <polygon points="1420,640 1480,675 1480,745 1420,780 1360,745 1360,675">
      <animate attributeName="fill-opacity" values="0.1;0.5;0.1" dur="3.2s" repeatCount="indefinite"/>
    </polygon>
    <polygon points="1300,710 1360,745 1360,815 1300,850 1240,815 1240,745" stroke="#34d399" fill="#10b981">
      <animate attributeName="fill-opacity" values="0.45;0.08;0.45" dur="3.8s" repeatCount="indefinite"/>
    </polygon>
    <polygon points="960,450 1040,495 1040,585 960,630 880,585 880,495" stroke-width="3">
      <animate attributeName="fill-opacity" values="0.12;0.5;0.12" dur="3s" repeatCount="indefinite"/>
    </polygon>
  </g>
</svg>