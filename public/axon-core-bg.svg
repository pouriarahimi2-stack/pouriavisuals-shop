<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="axonGlowBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.28"/>
      <stop offset="55%" stop-color="#3b82f6" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#07090e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="axonGlowIndigo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#8b5cf6" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#07090e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="circuitLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.05"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.05"/>
    </linearGradient>
    <pattern id="microTechGrid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M 80 0 L 0 0 0 80" fill="none" stroke="#38bdf8" stroke-width="0.6" stroke-opacity="0.12"/>
      <circle cx="40" cy="40" r="1" fill="#38bdf8" fill-opacity="0.18"/>
    </pattern>
  </defs>

  <!-- شبکه میکروچیپ پس‌زمینه -->
  <rect width="1920" height="1080" fill="url(#microTechGrid)"/>

  <!-- هاله‌های نوری متحرک (کوازارهای نئونی) -->
  <circle cx="380" cy="260" r="520" fill="url(#axonGlowBlue)">
    <animate attributeName="cx" values="350;650;350" dur="18s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="240;420;240" dur="14s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1540" cy="780" r="580" fill="url(#axonGlowIndigo)">
    <animate attributeName="cx" values="1560;1240;1560" dur="22s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="800;580;800" dur="16s" repeatCount="indefinite"/>
  </circle>

  <!-- خطوط مدار سخت‌افزاری (Axon Hardware Traces) -->
  <g fill="none" stroke="url(#circuitLine)" stroke-width="1.5">
    <path d="M -50 220 H 420 L 500 300 H 980 L 1060 220 H 1970" stroke-dasharray="14 10">
      <animate attributeName="stroke-dashoffset" from="240" to="0" dur="12s" repeatCount="indefinite"/>
    </path>
    <path d="M -50 840 H 580 L 660 760 H 1280 L 1360 840 H 1970" stroke-dasharray="18 12">
      <animate attributeName="stroke-dashoffset" from="0" to="300" dur="15s" repeatCount="indefinite"/>
    </path>
    <path d="M 280 -40 V 380 L 360 460 V 1120" stroke-opacity="0.22"/>
    <path d="M 1640 -40 V 620 L 1560 700 V 1120" stroke-opacity="0.22"/>
  </g>

  <!-- هسته مرکزی پردازنده (Axon Core Hexagon) -->
  <g transform="translate(960, 540)" opacity="0.28">
    <polygon points="0,-130 112,-65 112,65 0,130 -112,65 -112,-65" fill="none" stroke="#38bdf8" stroke-width="1.8" stroke-dasharray="10 6">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="45s" repeatCount="indefinite"/>
    </polygon>
    <polygon points="0,-90 78,-45 78,45 0,90 -78,45 -78,-45" fill="none" stroke="#818cf8" stroke-width="1.2">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="30s" repeatCount="indefinite"/>
    </polygon>
    <circle cx="0" cy="0" r="6" fill="#34d399">
      <animate attributeName="r" values="4;9;4" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- نودهای پالس نوری در نقاط تقاطع مدار -->
  <g>
    <circle cx="500" cy="300" r="4" fill="#38bdf8">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1060" cy="220" r="4" fill="#34d399">
      <animate attributeName="opacity" values="1;0.2;1" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="660" cy="760" r="4" fill="#818cf8">
      <animate attributeName="opacity" values="0.3;0.95;0.3" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1360" cy="840" r="4" fill="#38bdf8">
      <animate attributeName="opacity" values="0.9;0.15;0.9" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>