<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bgBase1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040711"/>
      <stop offset="50%" stop-color="#0a1128"/>
      <stop offset="100%" stop-color="#050814"/>
    </linearGradient>
    <radialGradient id="coreGlow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.45"/>
      <stop offset="45%" stop-color="#4facfe" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#040711" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violetGlow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#6366f1" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#040711" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cyanTrace" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="purpleTrace" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#c084fc" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.15"/>
    </linearGradient>
    <pattern id="pcbGrid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#38bdf8" stroke-width="0.7" stroke-opacity="0.16"/>
      <path d="M 30 0 L 30 60 M 0 30 L 60 30" fill="none" stroke="#6366f1" stroke-width="0.4" stroke-opacity="0.1"/>
      <circle cx="30" cy="30" r="1.3" fill="#38bdf8" fill-opacity="0.3"/>
    </pattern>
  </defs>

  <rect width="1920" height="1080" fill="url(#bgBase1)"/>
  <rect width="1920" height="1080" fill="url(#pcbGrid)"/>

  <!-- هاله‌های نوری پررنگ -->
  <circle cx="960" cy="540" r="620" fill="url(#coreGlow1)">
    <animate attributeName="r" values="550;680;550" dur="10s" repeatCount="indefinite"/>
  </circle>
  <circle cx="250" cy="200" r="480" fill="url(#violetGlow1)"/>
  <circle cx="1680" cy="880" r="520" fill="url(#violetGlow1)"/>

  <!-- شبکه متراکم مدارهای برد اصلی (PCB Traces) -->
  <g fill="none" stroke="#1e3a8a" stroke-width="2" opacity="0.75">
    <path d="M 0 140 H 320 L 390 210 H 740 L 820 290 H 1100 L 1180 210 H 1530 L 1600 140 H 1920"/>
    <path d="M 0 260 H 240 L 310 330 H 620 L 700 410 H 840"/>
    <path d="M 1920 260 H 1680 L 1610 330 H 1300 L 1220 410 H 1080"/>
    <path d="M 0 820 H 240 L 310 750 H 620 L 700 670 H 840"/>
    <path d="M 1920 820 H 1680 L 1610 750 H 1300 L 1220 670 H 1080"/>
    <path d="M 0 940 H 320 L 390 870 H 740 L 820 790 H 1100 L 1180 870 H 1530 L 1600 940 H 1920"/>
    <path d="M 180 0 V 220 L 260 300 V 780 L 180 860 V 1080"/>
    <path d="M 460 0 V 160 L 540 240 V 840 L 460 920 V 1080"/>
    <path d="M 1460 0 V 160 L 1380 240 V 840 L 1460 920 V 1080"/>
    <path d="M 1740 0 V 220 L 1660 300 V 780 L 1740 860 V 1080"/>
  </g>

  <!-- بسته‌های داده پرسرعت متحرک روی مدارها -->
  <g fill="none" stroke="url(#cyanTrace)" stroke-width="2.6" stroke-linecap="round">
    <path d="M 0 140 H 320 L 390 210 H 740 L 820 290 H 1100 L 1180 210 H 1530 L 1600 140 H 1920" stroke-dasharray="120 280">
      <animate attributeName="stroke-dashoffset" from="800" to="0" dur="7s" repeatCount="indefinite"/>
    </path>
    <path d="M 0 940 H 320 L 390 870 H 740 L 820 790 H 1100 L 1180 870 H 1530 L 1600 940 H 1920" stroke-dasharray="140 300">
      <animate attributeName="stroke-dashoffset" from="0" to="880" dur="8s" repeatCount="indefinite"/>
    </path>
    <path d="M 0 260 H 240 L 310 330 H 620 L 700 410 H 840" stroke-dasharray="80 220">
      <animate attributeName="stroke-dashoffset" from="600" to="0" dur="5s" repeatCount="indefinite"/>
    </path>
    <path d="M 1920 820 H 1680 L 1610 750 H 1300 L 1220 670 H 1080" stroke-dasharray="90 240">
      <animate attributeName="stroke-dashoffset" from="660" to="0" dur="5.5s" repeatCount="indefinite"/>
    </path>
  </g>

  <g fill="none" stroke="url(#purpleTrace)" stroke-width="2.4" stroke-linecap="round">
    <path d="M 1920 260 H 1680 L 1610 330 H 1300 L 1220 410 H 1080" stroke-dasharray="100 240">
      <animate attributeName="stroke-dashoffset" from="0" to="680" dur="6s" repeatCount="indefinite"/>
    </path>
    <path d="M 0 820 H 240 L 310 750 H 620 L 700 670 H 840" stroke-dasharray="100 240">
      <animate attributeName="stroke-dashoffset" from="680" to="0" dur="6s" repeatCount="indefinite"/>
    </path>
    <path d="M 460 0 V 160 L 540 240 V 840 L 460 920 V 1080" stroke-dasharray="110 260">
      <animate attributeName="stroke-dashoffset" from="740" to="0" dur="7.5s" repeatCount="indefinite"/>
    </path>
    <path d="M 1460 0 V 160 L 1380 240 V 840 L 1460 920 V 1080" stroke-dasharray="110 260">
      <animate attributeName="stroke-dashoffset" from="0" to="740" dur="7.5s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- سوکت و پردازنده مرکزی AXON CORE -->
  <g transform="translate(960, 540)">
    <!-- پین‌های اطراف سوکت پردازنده -->
    <rect x="-190" y="-190" width="380" height="380" rx="36" fill="#070d1f" fill-opacity="0.7" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.55"/>
    <rect x="-165" y="-165" width="330" height="330" rx="26" fill="none" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="8 6" stroke-opacity="0.65">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="60s" repeatCount="indefinite"/>
    </rect>
    <!-- حلقه‌های انرژی -->
    <circle cx="0" cy="0" r="135" fill="none" stroke="#00f2fe" stroke-width="2.5" stroke-dasharray="45 20 15 20" stroke-opacity="0.75">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="24s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="105" fill="none" stroke="#c084fc" stroke-width="2" stroke-dasharray="30 15" stroke-opacity="0.7">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="18s" repeatCount="indefinite"/>
    </circle>
    <polygon points="0,-75 65,-37 65,37 0,75 -65,37 -65,-37" fill="#0ea5e9" fill-opacity="0.15" stroke="#38bdf8" stroke-width="2.2">
      <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite"/>
    </polygon>
    <circle cx="0" cy="0" r="18" fill="#00f2fe" fill-opacity="0.85">
      <animate attributeName="r" values="14;24;14" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="fill-opacity" values="0.5;1;0.5" dur="2.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- نودهای درخشان تقاطع مدار -->
  <g fill="#00f2fe">
    <circle cx="390" cy="210" r="5"><animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="1530" cy="210" r="5"><animate attributeName="opacity" values="1;0.3;1" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="390" cy="870" r="5"><animate attributeName="opacity" values="0.8;0.2;0.8" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="1530" cy="870" r="5"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="620" cy="330" r="4.5" fill="#c084fc"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="1300" cy="330" r="4.5" fill="#c084fc"><animate attributeName="opacity" values="1;0.2;1" dur="2.1s" repeatCount="indefinite"/></circle>
    <circle cx="620" cy="750" r="4.5" fill="#34d399"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="1300" cy="750" r="4.5" fill="#34d399"><animate attributeName="opacity" values="1;0.3;1" dur="2.3s" repeatCount="indefinite"/></circle>
  </g>

  <!-- قاب‌های HUD در چهار گوشه تصویر -->
  <g stroke="#38bdf8" stroke-width="2.5" fill="none" opacity="0.65">
    <path d="M 40 100 V 40 H 120"/>
    <path d="M 1880 100 V 40 H 1800"/>
    <path d="M 40 980 V 1040 H 120"/>
    <path d="M 1880 980 V 1040 H 1800"/>
  </g>
</svg>