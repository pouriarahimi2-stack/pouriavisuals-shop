<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="proDarkBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030014"/>
      <stop offset="50%" stop-color="#090d26"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <radialGradient id="orbCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.65"/>
      <stop offset="45%" stop-color="#0ea5e9" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbMagenta" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbIndigo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.6"/>
      <stop offset="55%" stop-color="#3b82f6" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ribbon1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.1"/>
      <stop offset="35%" stop-color="#38bdf8" stop-opacity="0.55"/>
      <stop offset="70%" stop-color="#c084fc" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="ribbon2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#34d399" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#proDarkBase)"/>

  <!-- گوی‌های نوری شناور (Liquid Mesh Orbs) -->
  <circle cx="420" cy="320" r="650" fill="url(#orbCyan)">
    <animate attributeName="cx" values="380;780;380" dur="16s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="280;520;280" dur="12s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1500" cy="720" r="700" fill="url(#orbMagenta)">
    <animate attributeName="cx" values="1540;1120;1540" dur="19s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="760;440;760" dur="15s" repeatCount="indefinite"/>
  </circle>
  <circle cx="960" cy="540" r="620" fill="url(#orbIndigo)">
    <animate attributeName="r" values="520;740;520" dur="14s" repeatCount="indefinite"/>
  </circle>

  <!-- روبان‌های موجی ابریشمی متحرک -->
  <path d="M -100 680 C 420 380, 820 920, 1380 520 C 1640 340, 1820 640, 2020 480 L 2020 1120 L -100 1120 Z" fill="url(#ribbon1)">
    <animate attributeName="d" values="
      M -100 680 C 420 380, 820 920, 1380 520 C 1640 340, 1820 640, 2020 480 L 2020 1120 L -100 1120 Z;
      M -100 560 C 480 820, 920 340, 1420 680 C 1680 820, 1840 420, 2020 580 L 2020 1120 L -100 1120 Z;
      M -100 680 C 420 380, 820 920, 1380 520 C 1640 340, 1820 640, 2020 480 L 2020 1120 L -100 1120 Z
    " dur="18s" repeatCount="indefinite"/>
  </path>

  <path d="M -100 420 C 520 740, 1040 180, 1560 580 C 1760 720, 1900 380, 2020 440 L 2020 1120 L -100 1120 Z" fill="url(#ribbon2)">
    <animate attributeName="d" values="
      M -100 420 C 520 740, 1040 180, 1560 580 C 1760 720, 1900 380, 2020 440 L 2020 1120 L -100 1120 Z;
      M -100 620 C 460 260, 980 780, 1520 380 C 1740 260, 1880 620, 2020 520 L 2020 1120 L -100 1120 Z;
      M -100 420 C 520 740, 1040 180, 1560 580 C 1760 720, 1900 380, 2020 440 L 2020 1120 L -100 1120 Z
    " dur="22s" repeatCount="indefinite"/>
  </path>

  <!-- خطوط منحنی نئونی ظریف روی امواج -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.28" stroke-width="1.5">
    <path d="M -50 540 Q 480 220 960 540 T 1970 540"/>
    <path d="M -50 620 Q 480 880 960 560 T 1970 600" stroke="#38bdf8" stroke-opacity="0.45"/>
  </g>
</svg>