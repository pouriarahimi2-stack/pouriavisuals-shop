<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="hudBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="50%" stop-color="#08142c"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <radialGradient id="radarSweep" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.38"/>
      <stop offset="65%" stop-color="#3b82f6" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="horizonFade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0"/>
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#hudBg)"/>

  <!-- شبکه پرسپکتیو سه‌بعدی کف (3D Horizon Floor Grid) -->
  <g stroke="url(#horizonFade)" stroke-width="1.3" opacity="0.65">
    <line x1="960" y1="620" x2="-400" y2="1080"/>
    <line x1="960" y1="620" x2="-100" y2="1080"/>
    <line x1="960" y1="620" x2="200" y2="1080"/>
    <line x1="960" y1="620" x2="480" y2="1080"/>
    <line x1="960" y1="620" x2="720" y2="1080"/>
    <line x1="960" y1="620" x2="960" y2="1080"/>
    <line x1="960" y1="620" x2="1200" y2="1080"/>
    <line x1="960" y1="620" x2="1440" y2="1080"/>
    <line x1="960" y1="620" x2="1720" y2="1080"/>
    <line x1="960" y1="620" x2="2020" y2="1080"/>
    <line x1="960" y1="620" x2="2320" y2="1080"/>

    <!-- خطوط افقی پرسپکتیو کف -->
    <line x1="0" y1="680" x2="1920" y2="680" stroke-opacity="0.25"/>
    <line x1="0" y1="740" x2="1920" y2="740" stroke-opacity="0.35"/>
    <line x1="0" y1="815" x2="1920" y2="815" stroke-opacity="0.5"/>
    <line x1="0" y1="905" x2="1920" y2="905" stroke-opacity="0.65"/>
    <line x1="0" y1="1010" x2="1920" y2="1010" stroke-opacity="0.8"/>
  </g>

  <!-- شبکه پرسپکتیو سقف -->
  <g stroke="#38bdf8" stroke-width="1" opacity="0.25">
    <line x1="960" y1="460" x2="-300" y2="0"/>
    <line x1="960" y1="460" x2="200" y2="0"/>
    <line x1="960" y1="460" x2="600" y2="0"/>
    <line x1="960" y1="460" x2="960" y2="0"/>
    <line x1="960" y1="460" x2="1320" y2="0"/>
    <line x1="960" y1="460" x2="1720" y2="0"/>
    <line x1="960" y1="460" x2="2220" y2="0"/>
    <line x1="0" y1="120" x2="1920" y2="120"/>
    <line x1="0" y1="240" x2="1920" y2="240"/>
    <line x1="0" y1="350" x2="1920" y2="350"/>
  </g>

  <!-- رادار هولوگرافیک مرکزی -->
  <circle cx="960" cy="540" r="460" fill="url(#radarSweep)"/>

  <g transform="translate(960, 540)">
    <circle r="380" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.4" stroke-dasharray="12 8"/>
    <circle r="310" fill="none" stroke="#06b6d4" stroke-width="2" stroke-opacity="0.6" stroke-dasharray="80 30 20 30">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="32s" repeatCount="indefinite"/>
    </circle>
    <circle r="240" fill="none" stroke="#818cf8" stroke-width="2.2" stroke-opacity="0.65" stroke-dasharray="50 25 10 25">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="22s" repeatCount="indefinite"/>
    </circle>
    <circle r="170" fill="none" stroke="#34d399" stroke-width="1.5" stroke-opacity="0.55" stroke-dasharray="6 10">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="15s" repeatCount="indefinite"/>
    </circle>

    <!-- عقربه اسکنر رادار -->
    <g>
      <line x1="0" y1="0" x2="0" y2="-370" stroke="#00f2fe" stroke-width="3" stroke-opacity="0.85"/>
      <path d="M 0 0 L -90 -358 A 370 370 0 0 1 0 -370 Z" fill="#00f2fe" fill-opacity="0.18"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite"/>
    </g>

    <!-- خطوط نشانه رادار -->
    <line x1="-420" y1="0" x2="420" y2="0" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.35"/>
    <line x1="0" y1="-420" x2="0" y2="420" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.35"/>
  </g>

  <!-- پنل‌های تلمتری چپ و راست -->
  <g stroke="#00f2fe" stroke-width="2" fill="none" opacity="0.6">
    <polyline points="70,300 110,260 260,260"/>
    <polyline points="70,780 110,820 260,820"/>
    <polyline points="1850,300 1810,260 1660,260"/>
    <polyline points="1850,780 1810,820 1660,820"/>
  </g>
</svg>